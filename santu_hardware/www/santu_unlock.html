<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Santu Hardware</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #0f172a;
			font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
		}
		.wrap {
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.card {
			width: 280px;
			text-align: center;
			color: #e2e8f0;
		}
		.logo { font-size: 40px; margin-bottom: 8px; }
		.title { font-size: 20px; font-weight: 700; color: #fff; }
		.sub { font-size: 13px; color: #94a3b8; margin: 4px 0 20px; }
		input {
			width: 100%;
			box-sizing: border-box;
			padding: 12px 14px;
			font-size: 22px;
			letter-spacing: 6px;
			text-align: center;
			border-radius: 10px;
			border: 1px solid #334155;
			background: #1e293b;
			color: #fff;
			outline: none;
		}
		input:focus { border-color: #2563eb; }
		.error { min-height: 18px; color: #f87171; font-size: 12px; margin: 8px 0; }
		button {
			width: 100%;
			padding: 11px;
			border: none;
			border-radius: 10px;
			background: #2563eb;
			color: #fff;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
		button:disabled { opacity: 0.6; cursor: default; }
		/* The fingerprint is a real button, not something that only ever
		   happens to you. The prompt on page load can be dismissed, can time
		   out, or can never fire at all — with no button there was then no
		   way back to it short of relaunching the app. */
		.fp {
			margin-top: 10px;
			background: #1e293b;
			border: 1px solid #334155;
			display: none;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}
		.fp:hover { background: #273449; }
		.fp.show { display: flex; }
		.fp-icon { font-size: 17px; line-height: 1; }
		.enrol {
			display: none;
			margin-top: 14px;
			padding: 10px 12px;
			border-radius: 10px;
			background: #172033;
			border: 1px solid #334155;
			font-size: 12px;
			color: #cbd5e1;
			line-height: 1.45;
		}
		.enrol.show { display: block; }
		.enrol button { margin-top: 8px; padding: 8px; font-size: 13px; }
		.enrol .no {
			background: transparent;
			color: #94a3b8;
			border: 1px solid #334155;
			margin-top: 6px;
		}
		.enrol .no:hover { background: #1e293b; }
	</style>
	<script src="/assets/santu_hardware/js/santu_app_lock_webauthn.js"></script>
</head>
<body>
	<div class="wrap">
		<div class="card">
			<div class="logo">🔒</div>
			<div class="title">Santu Hardware</div>
			<div class="sub" id="sub-text">PIN daaliye (ya fingerprint try ho raha hai…)</div>
			<input type="password" inputmode="numeric" autocomplete="off" maxlength="8" id="pin-input" placeholder="••••">
			<div class="error" id="error-text"></div>
			<button type="button" id="unlock-btn">Unlock</button>
			<button type="button" class="fp" id="fp-btn"><span class="fp-icon">&#128070;</span><span>Fingerprint se kholo</span></button>
			<div class="enrol" id="enrol-box">
				<div id="enrol-text">Is Mac par fingerprint chalu kar dein? Agli baar sirf ungli lagani hogi.</div>
				<button type="button" id="enrol-yes">Haan, chalu karo</button>
				<button type="button" class="no" id="enrol-no">Abhi nahi</button>
			</div>
		</div>
	</div>

	<script>
		// The Jinja-rendered token from get_context() — santu_app_lock_webauthn.js
		// reads this for its own guest-side POSTs, since there is no session
		// cookie yet to pull one out of.
		window.SANTU_CSRF_TOKEN = "{{ csrf_token }}";

		// Standalone page, no Frappe desk assets loaded here — a plain fetch
		// against the whitelisted method, exactly like santu_app_lock.js does
		// for check_app_lock_pin. On success the server has already set the
		// session cookie on THIS response; redirecting to /app in the same
		// window carries it straight in, no separate cookie plumbing needed.
		const input = document.getElementById("pin-input");
		const btn = document.getElementById("unlock-btn");
		const errorText = document.getElementById("error-text");

		// The Jinja-rendered token from get_context() — this page has no
		// session cookie yet to read one back out of.
		const CSRF_TOKEN = "{{ csrf_token }}";
		function getCsrfToken() {
			return CSRF_TOKEN;
		}

		// Remembered only long enough to offer "chalu kar dein?" right after a
		// correct PIN — never stored anywhere by this page itself. Saving it
		// is the Keychain's job, behind Touch ID, and only if he says yes.
		let last_good_pin = null;

		function go_in() {
			// Same sessionStorage flag santu_app_lock.js checks on every Desk
			// page load — without setting it here, /app would immediately ask
			// for the PIN a second time right after this page collected it.
			try {
				sessionStorage.setItem("santu_applock_unlocked", "1");
			} catch (e) {
				/* ignore */
			}
			window.location.href = "/app";
		}

		async function attempt() {
			const pin = input.value.trim();
			if (!pin) return;
			btn.disabled = true;
			errorText.textContent = "";
			try {
				const res = await fetch("/api/method/santu_hardware.santu_hardware.api.pin_login", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						"X-Frappe-CSRF-Token": getCsrfToken(),
					},
					body: JSON.stringify({ pin }),
				});
				const data = await res.json().catch(() => ({}));
				if (res.ok && data && data.message && data.message.ok) {
					last_good_pin = pin;
					// Offer the fingerprint the moment it can actually be set
					// up — right here, with a PIN the server has just
					// confirmed. Buried on a settings screen, it never got
					// switched on at all (2026-09-05).
					if (await offer_enrolment()) return;
					go_in();
					return;
				}
				errorText.textContent =
					(data && data.exception && data.exception.split(":").pop().trim()) ||
					(data && data._server_messages && "Galat PIN.") ||
					"Galat PIN. Dobara try kariye.";
				input.value = "";
				input.focus();
			} catch (e) {
				errorText.textContent = "Kuch gadbad hui. Dobara try kariye.";
			}
			btn.disabled = false;
		}

		btn.addEventListener("click", attempt);
		input.addEventListener("keydown", (e) => {
			if (e.key === "Enter") attempt();
		});

		const fpBtn = document.getElementById("fp-btn");
		const enrolBox = document.getElementById("enrol-box");
		const subText = document.getElementById("sub-text");

		// Cached so the button and the enrol offer both read the same answer
		// instead of asking the bridge twice.
		let fp = { mode: null, enrolled: false };

		async function run_fingerprint() {
			fpBtn.disabled = true;
			errorText.textContent = "";
			const ok = await santu_app_lock_webauthn.tryLogin();
			fpBtn.disabled = false;
			if (ok) {
				go_in();
				return true;
			}
			// Cancelled, or the finger was not recognised. Not an error worth
			// shouting about — the PIN box is right there.
			subText.textContent = "PIN daaliye";
			input.focus();
			return false;
		}

		// Returns true if it took over the screen (asked the question).
		function offer_enrolment() {
			return new Promise((resolve) => {
				if (!(fp.mode && !fp.enrolled && last_good_pin)) {
					resolve(false);
					return;
				}
				enrolBox.classList.add("show");
				document.getElementById("enrol-yes").onclick = async () => {
					enrolBox.classList.remove("show");
					// Touch ID itself is asked for by the Keychain when it
					// stores the PIN, so a cancel here simply means "no".
					await santu_app_lock_webauthn.nativeEnroll(last_good_pin);
					go_in();
				};
				document.getElementById("enrol-no").onclick = () => {
					enrolBox.classList.remove("show");
					go_in();
				};
				resolve(true);
			});
		}

		// Fingerprint first, PIN as the fallback that is always right there
		// waiting — never a separate mode the person has to switch into.
		// A cancelled/failed Touch ID prompt just leaves the PIN box focused,
		// exactly as if fingerprint had never been tried — but now the BUTTON
		// stays on screen, so it can be tried again without relaunching.
		(async () => {
			if (!window.santu_app_lock_webauthn) {
				subText.textContent = "PIN daaliye";
				input.focus();
				return;
			}
			fp = await santu_app_lock_webauthn.availability();
			if (fp.mode && fp.enrolled) {
				fpBtn.classList.add("show");
				fpBtn.addEventListener("click", run_fingerprint);
				subText.textContent = "Ungli lagaiye ya PIN daaliye";
				if (await run_fingerprint()) return;
				return;
			}
			// Available but nothing registered on this Mac yet: say so, and
			// the PIN entry above will offer to set it up.
			subText.textContent = fp.mode
				? "PIN daaliye — phir fingerprint chalu kar sakte hain"
				: "PIN daaliye";
			input.focus();
		})();
	</script>
</body>
</html>
